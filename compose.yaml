services:
  virtitta:
    build:
      context: .
    image: ${VIRTITTA_IMAGE:-virtitta:local}
    restart: unless-stopped
    ports:
      - "${VIRTITTA_LISTEN_ADDRESS:-127.0.0.1}:${VIRTITTA_PORT:-8000}:8000"
    environment:
      FORWARDED_ALLOW_IPS: ${VIRTITTA_FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - type: bind
        source: ${VIRTITTA_CONFIG:-./virtitta.toml}
        target: /config/virtitta.toml
        read_only: true
      - type: bind
        source: ${VIRTITTA_DATA:-./data}
        target: /config/data
      - type: bind
        source: ${VIRTITTA_RESULTS_ROOT:?Set VIRTITTA_RESULTS_ROOT}
        target: ${VIRTITTA_RESULTS_CONTAINER_ROOT:-/results}
        read_only: true
      - type: bind
        source: ${VIRTITTA_CLARITY_ROOT:-./data}
        target: ${VIRTITTA_CLARITY_CONTAINER_ROOT:-/clarity}
        read_only: true
    command: ["serve", "--config", "/config/virtitta.toml", "--host", "0.0.0.0", "--port", "8000"]
