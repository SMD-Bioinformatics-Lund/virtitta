{% extends "base.html" %}
{% block content %}
<section class="panel login-panel">
  <h2>User account</h2>
  <p>Username: <strong>{{ current_user.username }}</strong><br>
    User category: <strong>{{ current_user.role }}</strong></p>
  <h3>Change password</h3>
  <p class="muted">Changing your password signs you out on all devices.</p>
  <form method="post" action="{{ request.url_for('change_password') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ current_user.csrf_token }}">
    <label>
      Current password
      <input type="password" name="current_password" autocomplete="current-password" required>
    </label>
    <label>
      New password
      <input type="password" name="new_password" autocomplete="new-password" required>
    </label>
    <label>
      Confirm new password
      <input type="password" name="confirm_password" autocomplete="new-password" required>
    </label>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
