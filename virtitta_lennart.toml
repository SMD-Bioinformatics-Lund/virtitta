[app]
title = "Virtitta"
host = "0.0.0.0"
port = 5812

[database]
path = "data/virtitta.sqlite3"

[igv]
enabled = true
base_url = "http://localhost:60151/load"

[webigv]
enabled = true
igv_js_url = "/static/igv.min.js"

[cluster]
enabled = true
output_root = "data/clusters"
grapetree_url = "http://mtlucmds1.lund.skane.se/grapetree/"
public_base_url = ""
max_concurrent_jobs = 1
timeout_seconds = 3600
input_output_key = "iupac_fasta"
five_prime_trim = 50
poly_t = true
poly_t_min_length = 10
poly_t_seed_length = 12
poly_t_seed_min_t = 10
poly_t_max_trailing_bases = 100
mafft_command = "mafft"
iqtree_command = "iqtree3"
mafft_args = ["--auto"]
iqtree_threads = 20
iqtree_args = []

[features]
comments = true
bulk_qc = true
igv = true

[annotations]
sample_categories = ["production", "validation", "EQA", "test"]
restricted_sample_categories = ["test"]

[exports]
lims_root = "data/lims_exports"

[imports]
clarity_metadata_root = "/fs2/seqdata/clarity"

[cache]
outputs_root = "data/output_cache"
output_keys = ["main_fasta", "iupac_fasta", "display_rug_kde_plot"]

[auth]
enabled = true
provider = "local"
session_days = 7
cookie_name = "virtitta_session"
cookie_secure = false
pbkdf2_iterations = 600000

[ui]
table_columns = [
  "lid",
  "sample_id",
  "sequencing_date",
  "generated_date",
  "sample_category",
  "qc_status",
  "manual_groups",
  "typing_report_subtype",
  "typing_main_blast_identity",
  "resistance_summary",
  "host_filter_reads_in",
  "host_filter_reads_removed_proportion",
  "qc_coverage_pct",
  "qc_mean_depth",
  "qc_coverage_1x_pct",
  "qc_coverage_10x_pct",
  "qc_coverage_100x_pct",
  "qc_coverage_1000x_pct",
  "variant_af_count_005",
  "variant_af_count_01",
  "variant_af_count_015",
  "variant_af_count_02",
  "variant_af_count_03",
  "variant_af_count_04",
  "sample_metadata_ct",
  "sample_metadata_library_concentration_ng_ul",
  "sample_metadata_library_fragment_length_bp",
  "run_name",
]
visible_columns = [
  "lid",
  "sample_id",
  "sequencing_date",
  "generated_date",
  "sample_category",
  "qc_status",
  "manual_groups",
  "typing_report_subtype",
  "typing_main_blast_identity",
  "resistance_summary",
  "host_filter_reads_in",
  "host_filter_reads_removed_proportion",
  "qc_coverage_pct",
  "qc_mean_depth",
  "qc_coverage_1x_pct",
  "qc_coverage_10x_pct",
  "qc_coverage_100x_pct",
  "variant_af_count_015",
  "sample_metadata_ct",
  "sample_metadata_library_concentration_ng_ul",
  "sample_metadata_library_fragment_length_bp",
  "run_name",
]
default_sort = "sequencing_date"
default_sort_desc = true

[ui.column_max_widths]
run_name = "36ch"
comment_count = "120px"

[ui.highlight_rules.host_filter_reads_removed_proportion]
warn_over = 0.1
danger_over = 0.5

[ui.highlight_rules.qc_coverage_1x_pct]
warn_under = 99
danger_under = 97

[ui.highlight_rules.qc_coverage_10x_pct]
warn_under = 97
danger_under = 95

[ui.highlight_rules.qc_coverage_pct]
warn_under = 95
danger_under = 90

[ui.highlight_rules.qc_mean_depth]
warn_under = 70
danger_under = 30

[ui.highlight_rules.typing_main_blast_identity]
warn_under = 90
danger_under = 85

[ui.highlight_rules.sample_metadata_ct]
warn_over = 32
danger_over = 36

[[results_roots]]
name = "hcv_results"
linux_path = "/fs1/results/virpipa/hcv"
windows_path = "Q:/results/virpipa/hcv"

